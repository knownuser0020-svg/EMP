name: Validate Forma EMS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: CHROMIUM_PATH=$(find ~/.cache/ms-playwright -path '*/chrome-linux/chrome' -o -path '*/chrome-linux64/chrome' | head -1) npm test
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f ems-backend/pom.xml verify
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        client: [admin, employee]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run package:${{ matrix.client }}
        env:
          EMS_API_URL: ${{ vars.EMS_API_URL || 'http://127.0.0.1:8080' }}
          EMS_UNSIGNED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: Forma-${{ matrix.client }}-Windows
          path: release/${{ matrix.client }}/*.exe
